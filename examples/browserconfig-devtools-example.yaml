apiVersion: browserconfig.selenosis.io/v1
kind: BrowserConfig
metadata:
  name: browserconfig-devtools-example
  namespace: selenosis
spec:
  template:
    labels:
      app: browser
    annotations:
      selenosis.io/session.type: "devtools"

    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

    sidecars:
    - name: seleniferous
      image: "alcounit/seleniferous:v2.1.3"
      env:
      - name: SESSION_CREATE_TIMEOUT
        value: "10m"
      - name: SESSION_IDLE_TIMEOUT
        value: "10m"
      - name: BROWSER_PORT
        value: "9222"
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      resources:
        limits:
          cpu: "0.2"
          memory: "128Mi"
        requests:
          cpu: "0.1"
          memory: "64Mi"

    volumes:
    - emptyDir:
        medium: Memory
      name: dshm

    volumeMounts:
    - mountPath: /dev/shm
      name: dshm

  browsers:
    devtools-chrome:
      "150.0":
        image: chromedp/headless-shell:150.0.7871.125
      "151.0":
        image: chromedp/headless-shell:151.0.7922.109
      "152.0":
        image: chromedp/headless-shell:152.0.7939.3